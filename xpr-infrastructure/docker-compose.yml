name: xpr-suite

# Environnement de développement complet. `make up` depuis la racine du monorepo.
# Le frontend Next.js tourne sur l'hôte (npm run dev) — HMR plus fiable qu'en conteneur.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xpr}
      POSTGRES_USER: ${DB_OWNER_USERNAME:-xpr_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-secret}
      # Rôle applicatif sans BYPASSRLS, créé par l'init (cf. docker/postgres/init)
      XPR_APP_USER: ${DB_USERNAME:-xpr_app}
      XPR_APP_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USERNAME:-xpr_owner} -d ${DB_DATABASE:-xpr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build:
      context: ./docker/php
    working_dir: /var/www/xpr-backend
    volumes:
      - ../xpr-backend:/var/www/xpr-backend
    environment:
      PHP_IDE_CONFIG: serverName=xpr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: ./docker/php
    working_dir: /var/www/xpr-backend
    command: php artisan horizon
    volumes:
      - ../xpr-backend:/var/www/xpr-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../xpr-backend:/var/www/xpr-backend:ro
    depends_on:
      - php

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # interface web
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-xpr}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-secret-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "${GOTENBERG_PORT:-3300}:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
