# Nginx HÔTE du VPS (PAS un conteneur Docker) — reverse-proxy unique devant :
#   - PM2 / Next.js standalone, sur 127.0.0.1:3000
#   - le conteneur Laravel (`app` de docker-compose.prod.yml), publié sur
#     127.0.0.1:8080
#
# À installer : /etc/nginx/sites-available/bcat.conf, puis
#   ln -s /etc/nginx/sites-available/bcat.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# TLS : certificat obtenu via `certbot certonly --nginx` (PAS `certbot
# --nginx`, qui réécrirait ce fichier tout seul — on garde ce vhost comme
# source de vérité versionnée). C'est provision-vps.sh qui orchestre l'ordre
# correct : vhost HTTP minimal → certbot certonly → ce fichier copié avec le
# domaine substitué, une fois le certificat présent sur le disque. Les
# chemins ssl_certificate ci-dessous correspondent à ce que `certonly` y
# dépose (aucune édition manuelle nécessaire, juste `votre-domaine.ma` → le
# vrai domaine, déjà fait par le script).

upstream bcat_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream bcat_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.ma;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Syntaxe `listen ... http2` (pas la directive séparée `http2 on;`,
    # apparue en 1.25.1) : Ubuntu 24.04 installe Nginx 1.24.0 depuis ses
    # dépôts officiels, où `http2 on;` est une directive inconnue —
    # `nginx -t` échoue dessus. Cette forme reste valide sur les versions
    # plus récentes (juste dépréciée, pas une erreur), donc compatible
    # dans les deux sens.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.ma;

    # Placeholders — remplacés par `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.ma/privkey.pem;

    # Uploads de pièces jointes (dépôts de dossiers, avatars) : aligné sur la
    # limite déjà en vigueur côté backend (docker/nginx/default.conf, dev).
    client_max_body_size 20m;

    # En-têtes de sécurité de base (complétés côté application Laravel).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- API Laravel : SEULS ces deux préfixes vont vers le backend --------
    # Doit précéder `location /` : Nginx retient le premier `location` préfixe
    # le plus spécifique qui matche, mais autant lever toute ambiguïté.
    location ~ ^/(api|sanctum)/ {
        proxy_pass http://bcat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Tout le reste : Next.js (pages, assets, print) ---------------------
    location / {
        proxy_pass http://bcat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Next gère lui-même le cache des assets sous /_next/static (immutable,
        # hashés) — rien à faire ici, la directive ci-dessus suffit.

        # next-intl (middleware de détection de langue) construit l'URL
        # absolue de sa redirection depuis HOSTNAME:PORT du serveur Next
        # lui-même (127.0.0.1:3000), PAS depuis le Host reçu — comportement
        # documenté en auto-hébergé (hors Vercel), vérifié en forçant Host et
        # X-Forwarded-Host sans effet. On réécrit donc le Location sortant
        # plutôt que d'attendre un correctif upstream.
        proxy_redirect http://localhost:3000/ https://$host/;
        proxy_redirect https://localhost:3000/ https://$host/;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
